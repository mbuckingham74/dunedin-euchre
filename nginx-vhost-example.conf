# nginx-vhost-example.conf
# Reference config for Nginx Proxy Manager on forkstech.com
#
# In Nginx Proxy Manager UI:
#   Proxy Hosts → Add Proxy Host
#   Domain Names:  dunedin-euchre.com, www.dunedin-euchre.com
#   Scheme:        http
#   Forward Host:  127.0.0.1  (or the server's LAN/Tailscale IP)
#   Forward Port:  3456
#   Cache Assets:  OFF
#   Block Common Exploits: ON
#   Websockets:    OFF
#   SSL: Request a Let's Encrypt cert, force HTTPS, HTTP/2

# ── Equivalent raw nginx config (for reference only) ──────────────────────────
server {
    listen 443 ssl http2;
    server_name dunedin-euchre.com www.dunedin-euchre.com;

    # SSL managed by NPM / Let's Encrypt
    # ssl_certificate / ssl_certificate_key set automatically by NPM

    # HSTS (2 years, include subdomains, preload ready)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers (defense in depth alongside Helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Max upload size (for location images)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name dunedin-euchre.com www.dunedin-euchre.com;
    return 301 https://$host$request_uri;
}
