services:
  dunedin-euchre:
    build: .
    container_name: dunedin-euchre
    mem_limit: 384m
    cpus: 1.5
    cpu_shares: 512
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    networks:
      - npm_network

volumes:
  data:
  uploads:

networks:
  npm_network:
    external: true
